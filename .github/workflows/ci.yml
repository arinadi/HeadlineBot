name: Python CI

on:
  push:
    branches: [ "main", "beta" ]
  pull_request:
    branches: [ "main", "beta" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # Colab VMs run Python 3.13; test on the same version.
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Lint
      run: ruff check .

    - name: Compile
      run: python -m compileall -q .

    - name: Test
      run: pytest -q

  # The colab CLI and the shell scripts only run on Linux/macOS: check them there
  # against the real CLI's interface. Offline: no Google login, no Colab quota.
  colab-cli:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install colab CLI
      run: |
        python -m pip install --upgrade pip
        pip install pytest google-colab-cli
        colab version

    - name: Shellcheck
      run: shellcheck colab/colab-run.sh

    - name: Scripts vs. colab CLI
      env:
        REQUIRE_COLAB_CLI: "1"
      run: pytest -q -rs tests/test_colab_scripts.py tests/test_bootstrap.py
