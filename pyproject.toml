[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E701",   # multiple statements on one line (codebase style)
    "B008",   # function call in default argument (FastAPI/Telegram style)
    "B009",   # getattr with constant (not harmful)
    "UP007",  # use X | Y for union types
    "UP022",  # prefer capture_output
]

[tool.ruff.lint.isort]
known-first-party = ["config", "model_manager", "utils", "bot_classes"]
